services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: impacto_manager
      MYSQL_USER: impacto_user
      MYSQL_PASSWORD: impacto_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: change-me-now
      DATABASE_URL: mysql+pymysql://impacto_user:impacto_password@db:3306/impacto_manager
      ADMIN_EMAIL: admin@impactomedia.local
      ADMIN_PASSWORD: ChangeMe123!
      COMPANY_TIMEZONE: America/Managua
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/app/static/uploads
volumes:
  mysql_data:
  uploads:
