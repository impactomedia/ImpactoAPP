{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Finanzas</span><h1>Egresos</h1></div></div><div class="row g-4"><div class="col-xl-4"><section class="panel-card"><h2 class="h5">Registrar gasto</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="expense_date" type="date" class="form-control mb-2"><input name="category" class="form-control mb-2" placeholder="Categoría"><input name="beneficiary" class="form-control mb-2" placeholder="Proveedor / beneficiario"><input name="description" class="form-control mb-2" placeholder="Descripción"><input name="amount" type="number" step="0.01" class="form-control mb-2" placeholder="Monto"><select name="status" class="form-select mb-2"><option>pagado</option><option>pendiente</option><option>anulado</option></select><label class="form-check"><input type="checkbox" name="recurring" class="form-check-input"> Recurrente</label><button class="btn btn-brand mt-2 w-100">Guardar</button></form></section></div><div class="col-xl-8"><section class="panel-card"><table class="table modern-table"><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th>Estado</th></tr></thead><tbody>{% for e in expenses %}<tr><td>{{ e.expense_date }}</td><td>{{ e.category }}</td><td>{{ e.description }}</td><td>{{ e.amount|money }}</td><td>{{ e.status|title }}</td></tr>{% endfor %}</tbody></table></section></div></div>{% endblock %}
