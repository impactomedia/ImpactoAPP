{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Planilla</span><h1>Períodos de pago</h1></div></div><div class="row g-4"><div class="col-xl-4"><section class="panel-card"><h2 class="h5">Generar período</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" class="form-control mb-2" placeholder="Nombre"><input name="starts_on" type="date" class="form-control mb-2" required><input name="ends_on" type="date" class="form-control mb-2" required><button class="btn btn-brand w-100">Generar planilla</button></form></section></div><div class="col-xl-8"><section class="panel-card"><table class="table modern-table"><thead><tr><th>Período</th><th>Desde</th><th>Hasta</th><th>Estado</th><th></th></tr></thead><tbody>{% for p in periods %}<tr><td>{{ p.name }}</td><td>{{ p.starts_on }}</td><td>{{ p.ends_on }}</td><td>{{ p.status|title }}</td><td><a href="{{ url_for('finance.payroll_detail', period_id=p.id) }}">Ver</a></td></tr>{% endfor %}</tbody></table></section></div></div>{% endblock %}
