{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Imprenta</span><h1>Nueva orden</h1></div></div><section class="panel-card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-4"><label>Cliente</label><select name="client_id" class="form-select">{% for c in clients %}<option value="{{ c.id }}">{{ c.business_name }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Venta</label><select name="sale_id" class="form-select"><option value="">—</option>{% for s in sales %}<option value="{{ s.id }}">{{ s.sale_no }} — {{ s.client.business_name }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Responsable</label><select name="responsible_id" class="form-select"><option value="">—</option>{% for c in collaborators %}<option value="{{ c.id }}">{{ c.user.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Proveedor</label><input name="provider" class="form-control"></div><div class="col-md-4"><label>Costo</label><input name="total_cost" type="number" step="0.01" class="form-control"></div><div class="col-md-4"><label>Venta</label><input name="total_sale" type="number" step="0.01" class="form-control"></div><div class="col-12"><label>Dirección de entrega</label><input name="shipping_address" class="form-control"></div></div><h2 class="h5 mt-4">Productos</h2><div id="printRows"><div class="row g-2 mb-2"><div class="col-md-4"><input name="item_name[]" class="form-control" placeholder="Producto" required></div><div class="col-md-2"><input name="quantity[]" type="number" class="form-control" value="1"></div><div class="col-md-6"><input name="specification[]" class="form-control" placeholder="Especificaciones"></div></div></div><template id="printTpl"><div class="row g-2 mb-2"><div class="col-md-4"><input name="item_name[]" class="form-control" placeholder="Producto" required></div><div class="col-md-2"><input name="quantity[]" type="number" class="form-control" value="1"></div><div class="col-md-6"><input name="specification[]" class="form-control" placeholder="Especificaciones"></div></div></template><button type="button" class="btn btn-light border" data-add-row="#printRows" data-template="#printTpl">+ Producto</button><button class="btn btn-brand mt-3">Crear orden</button></form></section>{% endblock %}
