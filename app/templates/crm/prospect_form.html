{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">CRM</span><h1>Nuevo prospecto</h1><p>Registra la oportunidad comercial y evita duplicados.</p></div></div><section class="panel-card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Negocio *</label><input name="business_name" class="form-control" required></div><div class="col-md-6"><label class="form-label">Contacto *</label><input name="contact_name" class="form-control" required></div><div class="col-md-4"><label class="form-label">Teléfono</label><input name="phone" class="form-control"></div><div class="col-md-4"><label class="form-label">Correo</label><input name="email" type="email" class="form-control"></div><div class="col-md-4"><label class="form-label">Canal preferido</label><select name="preferred_channel" class="form-select"><option>WhatsApp</option><option>Llamada</option><option>Email</option></select></div><div class="col-md-4"><label class="form-label">Industria</label><input name="industry" class="form-control"></div><div class="col-md-4"><label class="form-label">Fuente</label><select name="source" class="form-select"><option>Llamada en frío</option><option>Facebook</option><option>Instagram</option><option>Google</option><option>Website</option><option>WhatsApp</option><option>Referido</option><option>Evento</option><option>Importado</option></select></div><div class="col-md-4"><label class="form-label">Responsable</label><select name="owner_id" class="form-select"><option value="">Automático</option>{% for c in collaborators %}<option value="{{ c.id }}">{{ c.user.name }} — {{ c.job_title }}{% if c.advisor_project %} · {{ c.advisor_project.name }}{% endif %}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Prioridad</label><select name="priority" class="form-select"><option>baja</option><option selected>media</option><option>alta</option><option>urgente</option></select></div><div class="col-md-4"><label class="form-label">Interés principal</label><input name="main_interest" class="form-control"></div><div class="col-md-4"><label class="form-label">Presupuesto estimado</label><input name="estimated_budget" type="number" step="0.01" class="form-control"></div><div class="col-md-6"><label class="form-label">Website</label><input name="website" class="form-control"></div><div class="col-md-6"><label class="form-label">Instagram</label><input name="instagram" class="form-control"></div><div class="col-12"><label class="form-label">Servicios del negocio</label><textarea name="services_offered" class="form-control"></textarea></div><div class="col-12"><label class="form-label">Notas</label><textarea name="notes" class="form-control"></textarea></div></div><button class="btn btn-brand mt-4">Guardar prospecto</button></form></section>{% endblock %}
