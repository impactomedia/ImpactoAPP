{% extends "app_base.html" %}
{% block app_content %}
<div class="page-heading"><div><span class="eyebrow">Cotización</span><h1>Nueva cotización</h1><p>{{ client.business_name }}</p></div></div>
<section class="panel-card form-card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3 mb-3">
      <div class="col-md-3"><label class="form-label">Moneda</label><input class="form-control" value="USD" readonly><input type="hidden" name="currency" value="USD"><small class="text-secondary">Impacto cobra únicamente en dólares.</small></div>
      <div class="col-md-3"><label class="form-label">Descuento</label><input name="discount" type="number" step="0.01" min="0" class="form-control" value="0"></div>
      <div class="col-md-3"><label class="form-label">Válida hasta</label><input name="valid_until" type="date" class="form-control"></div>
    </div>
    <h2 class="h5">Ítems</h2>
    <div id="quoteRows">
      <div class="row g-2 mb-2">
        <div class="col-md-3"><select name="product_id[]" class="form-select"><option value="">Personalizado</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.base_price or '' }}" data-package="{{ '1' if p.category=='paquete' else '0' }}">{{ p.name }}{% if p.category=='paquete' and p.base_price %} — USD {{ p.base_price|money }}{% endif %}</option>{% endfor %}</select></div>
        <div class="col-md-4"><input name="description[]" class="form-control" placeholder="Descripción" required></div>
        <div class="col-md-2"><input name="quantity[]" type="number" step="0.01" min="0.01" value="1" class="form-control"></div>
        <div class="col-md-3"><input name="unit_price[]" type="number" step="0.01" min="0" class="form-control" placeholder="Precio" required></div>
      </div>
    </div>
    <template id="quoteTpl"><div class="row g-2 mb-2"><div class="col-md-3"><select name="product_id[]" class="form-select"><option value="">Personalizado</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.base_price or '' }}" data-package="{{ '1' if p.category=='paquete' else '0' }}">{{ p.name }}{% if p.category=='paquete' and p.base_price %} — USD {{ p.base_price|money }}{% endif %}</option>{% endfor %}</select></div><div class="col-md-4"><input name="description[]" class="form-control" placeholder="Descripción" required></div><div class="col-md-2"><input name="quantity[]" type="number" step="0.01" min="0.01" value="1" class="form-control"></div><div class="col-md-3"><input name="unit_price[]" type="number" step="0.01" min="0" class="form-control" placeholder="Precio" required></div></div></template>
    <button type="button" class="btn btn-light border" data-add-row="#quoteRows" data-template="#quoteTpl">+ Agregar ítem</button>
    <div class="mt-3"><label class="form-label">Notas</label><textarea name="notes" class="form-control"></textarea></div>
    <label class="form-check mt-3"><input class="form-check-input" type="checkbox" name="mark_sent" checked> Marcar como enviada</label>
    <button class="btn btn-brand mt-3">Crear cotización</button>
  </form>
</section>
<script>
document.addEventListener('DOMContentLoaded', () => {
  function bindRow(row) {
    const select=row.querySelector('select[name="product_id[]"]');
    const price=row.querySelector('input[name="unit_price[]"]');
    if(!select || !price) return;
    select.addEventListener('change', () => {
      const opt=select.options[select.selectedIndex];
      if(opt?.dataset.package==='1'){
        price.value=opt.dataset.price || '';
        price.readOnly=true;
      }else{
        price.readOnly=false;
        if(opt?.dataset.price && !price.value) price.value=opt.dataset.price;
      }
    });
  }
  document.querySelectorAll('#quoteRows .row').forEach(bindRow);
  const observer=new MutationObserver(() => document.querySelectorAll('#quoteRows .row').forEach(bindRow));
  observer.observe(document.getElementById('quoteRows'), {childList:true});
});
</script>
{% endblock %}
