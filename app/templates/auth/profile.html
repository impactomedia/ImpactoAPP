{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Mi cuenta</span><h1>Perfil personal</h1><p>Actualiza tu nombre o contraseña.</p></div></div><section class="panel-card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="name" value="{{ current_user.name }}"></div><div class="col-md-6"><label class="form-label">Correo</label><input class="form-control" value="{{ current_user.email }}" disabled></div><div class="col-md-6"><label class="form-label">Nueva contraseña</label><input class="form-control" type="password" name="new_password" placeholder="Dejar vacío para conservar"></div></div><button class="btn btn-brand mt-4">Guardar cambios</button></form></section>{% endblock %}
