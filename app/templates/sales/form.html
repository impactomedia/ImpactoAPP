{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Ventas</span><h1>Nueva venta</h1><p>Registra una compra directa y genera el trabajo operativo.</p></div></div><section class="panel-card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-4"><label class="form-label">Cliente</label><select name="client_id" class="form-select">{% for c in clients %}<option value="{{ c.id }}">{{ c.business_name }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Asesor</label><select name="advisor_id" class="form-select"><option value="">Usar responsable del cliente</option>{% for c in advisors %}<option value="{{ c.id }}">{{ c.user.name }}</option>{% endfor %}</select></div><div class="col-md-2"><label class="form-label">Fecha</label><input type="date" name="sale_date" class="form-control"></div><div class="col-md-2"><label class="form-label">Moneda</label><select name="currency" class="form-select"><option>USD</option><option>NIO</option></select></div></div><h2 class="h5 mt-4">Ítems</h2><div id="saleRows"><div class="row g-2 mb-2"><div class="col-md-3"><select name="product_id[]" class="form-select"><option value="">Personalizado</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div><div class="col-md-4"><input name="description[]" class="form-control" placeholder="Descripción" required></div><div class="col-md-2"><input name="quantity[]" type="number" step="0.01" value="1" class="form-control"></div><div class="col-md-3"><input name="unit_price[]" type="number" step="0.01" class="form-control" placeholder="Precio"></div></div></div><template id="saleTpl"><div class="row g-2 mb-2"><div class="col-md-3"><select name="product_id[]" class="form-select"><option value="">Personalizado</option>{% for p in products %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div><div class="col-md-4"><input name="description[]" class="form-control" placeholder="Descripción" required></div><div class="col-md-2"><input name="quantity[]" type="number" step="0.01" value="1" class="form-control"></div><div class="col-md-3"><input name="unit_price[]" type="number" step="0.01" class="form-control" placeholder="Precio"></div></div></template><button type="button" class="btn btn-light border" data-add-row="#saleRows" data-template="#saleTpl">+ Agregar ítem</button><div class="row g-3 mt-3"><div class="col-md-3"><label class="form-label">Pago inicial</label><input name="initial_payment" type="number" step="0.01" class="form-control" value="0"></div><div class="col-md-3"><label class="form-label">Método</label><select name="payment_method" class="form-select"><option>transferencia</option><option>efectivo</option><option>Zelle</option><option>ACH</option><option>Wise</option></select></div><div class="col-md-3"><label class="form-label">Vencimiento saldo</label><input name="due_date" type="date" class="form-control"></div></div><button class="btn btn-brand mt-4">Registrar venta</button></form></section>{% endblock %}
