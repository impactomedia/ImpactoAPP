{% extends "app_base.html" %}
{% block app_content %}
<div class="page-heading"><div><span class="eyebrow">Tareas</span><h1>Nueva tarea</h1></div></div>
<section class="panel-card form-card">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row g-3">
      <div class="col-md-8"><label class="form-label">Título</label><input name="title" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Tipo</label><input name="task_type" class="form-control" value="cliente"></div>
      <div class="col-md-4"><label class="form-label">Cliente</label><select name="client_id" class="form-select"><option value="">—</option>{% for c in clients %}<option value="{{ c.id }}">{{ c.business_name }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Proyecto</label><select name="project_id" class="form-select"><option value="">—</option>{% for p in projects %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></div>
      <div class="col-md-4"><label class="form-label">Responsable</label><select name="assignee_id" class="form-select"><option value="">—</option>{% for c in collaborators %}<option value="{{ c.id }}">{{ c.user.name }}</option>{% endfor %}</select></div>
      <div class="col-md-3"><label class="form-label">Prioridad</label><select name="priority" class="form-select"><option value="baja">Baja</option><option value="media" selected>Media</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></div>
      <div class="col-md-3"><label class="form-label">Inicio</label><input name="starts_at" type="datetime-local" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">Vencimiento</label><input name="due_at" type="datetime-local" class="form-control"></div>
      <div class="col-md-3"><label class="form-label">Minutos estimados</label><input name="estimated_minutes" type="number" min="0" class="form-control"></div>
      <div class="col-12"><label class="form-label">Descripción</label><textarea name="description" class="form-control"></textarea></div>
      <div class="col-12"><label class="form-label">Checklist (usa [x] para marcar completado)</label><textarea name="checklist" class="form-control" placeholder="[ ] Recopilar datos&#10;[ ] Confirmar accesos"></textarea></div>
    </div>
    <button class="btn btn-brand mt-3">Crear tarea</button>
  </form>
</section>
{% endblock %}
