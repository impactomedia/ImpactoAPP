{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Operaciones</span><h1>Nuevo proyecto</h1></div></div><section class="panel-card form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label>Cliente</label><select name="client_id" class="form-select">{% for c in clients %}<option value="{{ c.id }}">{{ c.business_name }}</option>{% endfor %}</select></div><div class="col-md-6"><label>Nombre</label><input name="name" class="form-control" required></div><div class="col-md-4"><label>Coordinador</label><select name="coordinator_id" class="form-select"><option value="">Sin asignar</option>{% for c in collaborators %}<option value="{{ c.id }}">{{ c.user.name }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Área</label><input name="department" class="form-control"></div><div class="col-md-4"><label>Estado</label><select name="status" class="form-select">{% for s in states %}<option>{{ s }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Inicio</label><input name="starts_on" type="date" class="form-control"></div><div class="col-md-4"><label>Entrega</label><input name="due_on" type="date" class="form-control"></div><div class="col-md-4"><label>Progreso</label><input name="progress" type="number" min="0" max="100" class="form-control" value="0"></div><div class="col-12"><label>Notas</label><textarea name="notes" class="form-control"></textarea></div></div><button class="btn btn-brand mt-3">Crear</button></form></section>{% endblock %}
