{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Configuración</span><h1>Catálogos</h1></div></div><section class="panel-card mb-4"><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col"><input name="category" class="form-control" placeholder="Categoría"></div><div class="col"><input name="code" class="form-control" placeholder="Código"></div><div class="col"><input name="label" class="form-control" placeholder="Etiqueta"></div><div class="col-auto"><button class="btn btn-brand">Agregar</button></div></form></section><section class="panel-card"><table class="table modern-table"><thead><tr><th>Categoría</th><th>Código</th><th>Etiqueta</th><th>Activo</th></tr></thead><tbody>{% for i in items %}<tr><td>{{ i.category }}</td><td>{{ i.code }}</td><td>{{ i.label }}</td><td>{{ i.active }}</td></tr>{% endfor %}</tbody></table></section>{% endblock %}
