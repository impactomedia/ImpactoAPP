{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Seguridad</span><h1>Roles y permisos</h1></div></div><div class="row g-4"><div class="col-xl-4"><section class="panel-card"><h2 class="h5">Nuevo rol</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="name" class="form-control mb-2" placeholder="Código"><input name="label" class="form-control mb-2" placeholder="Nombre visible"><textarea name="description" class="form-control mb-2"></textarea><label>Permisos</label><select name="permission_ids" multiple class="form-select" size="12">{% for p in permissions %}<option value="{{ p.id }}">{{ p.module }} · {{ p.label }}</option>{% endfor %}</select><button class="btn btn-brand mt-2 w-100">Crear</button></form></section></div><div class="col-xl-8">{% for r in roles %}<section class="panel-card mb-3"><div class="panel-header"><div><h2>{{ r.label }}</h2><p>{{ r.name }}</p></div></div><form method="post" action="{{ url_for('settings.update_role_permissions', role_id=r.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row">{% for p in permissions %}<div class="col-md-4"><label class="form-check"><input class="form-check-input" type="checkbox" name="permission_ids" value="{{ p.id }}" {% if p in r.permissions %}checked{% endif %}> {{ p.label }}</label></div>{% endfor %}</div><button class="btn btn-dark mt-2">Actualizar</button></form></section>{% endfor %}</div></div>{% endblock %}
