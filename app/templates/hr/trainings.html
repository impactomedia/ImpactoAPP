{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Capacitaciones</span><h1>Formación del equipo</h1></div></div><div class="row g-4"><div class="col-xl-4"><section class="panel-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input name="title" class="form-control mb-2" placeholder="Título"><input name="training_date" type="date" class="form-control mb-2" required><select name="status" class="form-select mb-2"><option>programada</option><option>en_curso</option><option>completada</option><option>cancelada</option></select><label>Participantes</label><select name="attendee_ids" multiple class="form-select mb-2" size="6">{% for c in collaborators %}<option value="{{ c.id }}">{{ c.user.name }}</option>{% endfor %}</select><textarea name="description" class="form-control mb-2" placeholder="Descripción"></textarea><button class="btn btn-brand w-100">Guardar</button></form></section></div><div class="col-xl-8"><section class="panel-card"><table class="table modern-table"><thead><tr><th>Fecha</th><th>Título</th><th>Estado</th><th>Participantes</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.training_date }}</td><td>{{ r.title }}</td><td>{{ r.status|title }}</td><td>{{ r.attendees|length }}</td></tr>{% endfor %}</tbody></table></section></div></div>{% endblock %}
