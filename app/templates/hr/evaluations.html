{% extends "app_base.html" %}{% block app_content %}<div class="page-heading"><div><span class="eyebrow">Desempeño</span><h1>Evaluaciones</h1></div></div><div class="row g-4"><div class="col-xl-4"><section class="panel-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><select name="collaborator_id" class="form-select mb-2">{% for c in collaborators %}<option value="{{ c.id }}">{{ c.user.name }}</option>{% endfor %}</select><input name="evaluation_date" type="date" class="form-control mb-2"><input name="period" class="form-control mb-2" placeholder="Período"><input name="score" type="number" step="0.01" class="form-control mb-2" placeholder="Puntaje"><textarea name="notes" class="form-control mb-2" placeholder="Observaciones"></textarea><button class="btn btn-brand w-100">Registrar</button></form></section></div><div class="col-xl-8"><section class="panel-card"><table class="table modern-table"><thead><tr><th>Fecha</th><th>Colaborador</th><th>Período</th><th>Puntaje</th></tr></thead><tbody>{% for r in rows %}<tr><td>{{ r.evaluation_date }}</td><td>{{ r.collaborator.user.name }}</td><td>{{ r.period or '—' }}</td><td>{{ r.score }}</td></tr>{% endfor %}</tbody></table></section></div></div>{% endblock %}
